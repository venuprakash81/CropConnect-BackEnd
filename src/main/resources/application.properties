
# ==========================================
# CROPCONNECT APPLICATION
# ==========================================
spring.application.name=CropConnect

# ==========================================
# SERVER CONFIGURATION
# Render provides PORT automatically.
# Locally, the backend runs on port 8081.
# ==========================================
server.port=${PORT:8081}

# ==========================================
# AIVEN MYSQL DATABASE
# Configure these variables in Render.
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cropconnect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# DATABASE CONNECTION POOL
# ==========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# MYSQL SSL
# ==========================================
spring.datasource.hikari.data-source-properties.sslMode=REQUIRED

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# FILE UPLOADS
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB